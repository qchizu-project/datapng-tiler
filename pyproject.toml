[project]
name = "datapng-tiler"
dynamic = ["version"]
description = "Generate data tiles (numerical / palette) and TileJSON conforming to the TileJSON DataPNG Extension"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "qchizu" }]
keywords = ["gis", "tiles", "tilejson", "raster", "dem", "webp", "png", "xyz"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Typing :: Typed",
]
dependencies = [
    "rasterio>=1.3",
    "numpy>=1.26",
    "pillow>=10.0",
    "jsonschema>=4.20",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/qchizu-project/datapng-tiler"
Repository = "https://github.com/qchizu-project/datapng-tiler"
Issues = "https://github.com/qchizu-project/datapng-tiler/issues"
Changelog = "https://github.com/qchizu-project/datapng-tiler/blob/main/CHANGELOG.md"
Specification = "https://github.com/qchizu-project/tilejson-datapng-extension"

[project.scripts]
datapng-tiler = "datapng_tiler.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# 単一 semver の SSoT: src/datapng_tiler/__init__.py の __version__ を参照
path = "src/datapng_tiler/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/datapng_tiler"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

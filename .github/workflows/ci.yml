name: ci

# PR と main への push で lint / テストを走らせる。
# 一般公開ツールのため 3 OS で回す。特にプロセス並列は Linux が fork、macOS/Windows が
# spawn と既定が異なり、ワーカへ状態を渡す経路の壊れ方が OS で変わる（tests/test_engine.py）。
on:
  pull_request:
  push:
    branches:
      - main

# fork からの PR でもブランチ側のコードを実行するため、既定より絞る。
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: ruff check
        run: uv run --locked ruff check .
      - name: ruff format --check
        run: uv run --locked ruff format --check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: pytest
        run: uv run --locked pytest

  spec-schema:
    # 同梱している JSON Schema が仕様リポジトリの配布物と一致しているかを確認する
    # （仕様が更新されたのに実装側のスキーマが古いまま、を防ぐ）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: 仕様リポジトリのスキーマと突合
        run: uv run --locked python scripts/check_schema_sync.py
